name: Build Credlock Intern Portal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/CredlockInternPortal/CredlockInternPortal.csproj
      - name: Build
        run: dotnet build src/CredlockInternPortal/CredlockInternPortal.csproj --configuration Release --no-restore
